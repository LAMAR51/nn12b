name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/github-pages-server-2k99jf
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Requires Pages to be switched on once under
      # Settings -> Pages -> Source: GitHub Actions.
      # The default GITHUB_TOKEN cannot create the Pages site itself.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
